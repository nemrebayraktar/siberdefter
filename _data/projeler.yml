    Pages iş akışıyla nemrebayraktar.github.io/siberdefter adresine çıkar.
  alan: >-
    Denetim notunu dağınık dosyada bırakmadan yayımlar. İçerik, çalışma
    kâğıdı disiplini, CISA alanları ve tekrar kartlarıdır.
  etiketler:
    - Jekyll
    - GitHub Actions
    - GitHub Pages
    - Markdown
    - Ruby
  github: "https://github.com/nemrebayraktar/siberdefter"
  github_yazi: "github.com/nemrebayraktar/siberdefter"
  site: "https://nemrebayraktar.github.io/siberdefter/"
