- no: "01"
  baslik: İz sürülebilir not
  metin: Amaç, kapsam, yapılan iş, kanıt ve sonuç ayrı durur. “Baktım” bir kayıt değildir.
- no: "02"
  baslik: Resmi materyal değildir
  metin: CISA notları ve kartlar özgün çalışmadır. Sınav sorusu, telifli soru bankası veya sertifika beyanı değildir.
- no: "03"
  baslik: Yazılmayan unvan yazılmaz
  metin: Hakkında sayfasında olmayan deneyim ve sertifika eklenmez. CISA hedefi 2027 başıdır; sertifika henüz yoktur.
