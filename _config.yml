# BT Denetim Notları yapılandırması
# Yayın: https://nemrebayraktar.github.io/siberdefter/
# url sitenin köküdür. baseurl proje sitesinin klasörüdür.
# İkisini birden değiştirirseniz paylaşım bağlantıları ve iç yollar kayar.

title: BT Denetim Notları
description: >-
  Emre Bayraktar, Bilgi Sistemleri Denetçisi Adayı.
  BT denetimi çalışma defteri. CISA sertifikası yoktur;
  sınav hedefi 2027 başıdır.
url: "https://nemrebayraktar.github.io"
baseurl: "/siberdefter"
lang: tr_TR
timezone: Europe/Istanbul
author: Emre Bayraktar

permalink: /yazilar/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  auto_ids: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

future: false
show_excerpts: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: "cisa"
    values:
      uyari: >-
        Özgün çalışma notudur. ISACA sınav sorusu, telifli soru bankası
        veya resmi müfredat metni değildir. Sertifika sahibi olunduğu
        anlamına gelmez.
  - scope:
      path: "kisa-notlar"
    values:
      uyari: >-
        Çalışırken tutulmuş özgün kısa notlardır.
        Denetim raporu veya bir standardın metni değildir.
  - scope:
      path: "soru-notlari"
    values:
      uyari: >-
        Sorulardan çıkarılmış özgün hatırlatmalardır.
        Gerçek sınav sorusu, şık veya telifli soru bankası metni değildir.

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .gitignore
  - .gitattributes
  - .editorconfig
  - script
  - node_modules
